<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVERMOD — Thank You</title>
<style>
body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#f5f4f2; color:#1a1a1a; }
.hero { background:#141414; color:#fff; padding:70px 40px; text-align:center; }
.hero h1 { font-size:42px; font-weight:700; letter-spacing:.04em; margin:0 0 10px; }
.hero p { font-weight:300; opacity:.75; margin:0; letter-spacing:.05em; }
.section { max-width:900px; margin:50px auto 0; padding:0 24px; }
.section h2 { font-size:26px; font-weight:700; margin:0; }
.section .sub { font-weight:300; color:#777; margin:6px 0 0; }
.cards { display:flex; gap:16px; flex-wrap:wrap; margin-top:22px; }
.card { flex:1; min-width:260px; background:#fff; border:1px solid #e6e4e0; border-radius:12px; padding:26px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; text-align:left; font-family:inherit; }
.card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.08); }
.card .num { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:#141414; color:#fff; font-weight:700; font-size:14px; margin-bottom:12px; }
.card h3 { font-weight:700; font-size:17px; margin:0 0 8px; }
.card p { font-weight:300; line-height:1.55; color:#555; margin:0 0 14px; font-size:14px; }
.card .go { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#141414; }
.card .go svg { width:15px; height:15px; fill:#141414; }
.card .phone { display:block; margin-top:10px; font-size:13px; color:#888; font-weight:300; }
.card .phone a { color:#1a1a1a; text-decoration:none; font-weight:400; }
.chatsec { max-width:900px; margin:44px auto 0; padding:0 24px; }
.chatsec h2 { font-size:26px; font-weight:700; margin:0; }
.chatsec .sub { font-weight:300; color:#777; margin:6px 0 18px; }
.footer { text-align:center; font-weight:300; color:#999; font-size:12px; padding:34px 20px 60px; }
</style>
</head><body>

<div class="hero">
  <h1>THANK YOU!</h1>
  <p>YOUR INQUIRY HAS BEEN RECEIVED</p>
</div>

<div class="section">
  <h2>What's next?</h2>
  <p class="sub">Choose how you'd like to continue — or just scroll down and write to Orion in the chat below.</p>
  <div class="cards">
    <button class="card" onclick="EvermodChat.scrollTo()">
      <span class="num">1</span>
      <h3>Get an Immediate Answer</h3>
      <p>Chat with Orion, our AI assistant, right here — instant answers about models, floor plans, delivery and warranties.</p>
      <span class="go">Chat with Orion
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </span>
    </button>
    <button class="card" id="evm-card-video">
      <span class="num">2</span>
      <h3>Book a Video Call</h3>
      <p>Walk through the designs together with a specialist. Pick a time that suits you.</p>
      <span class="go">Book a video call
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </span>
    </button>
    <button class="card" onclick="EvermodChat.ask(EVERMOD_CHAT_CONFIG.callbackText)">
      <span class="num">3</span>
      <h3>Request a Call Back</h3>
      <p>Leave the details in the chat and our specialist will call you back at a time that suits you.</p>
      <span class="go">Request a call back
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </span>
      <span class="phone">Or call us directly: <a href="tel:+37127034348">+371 27034348</a></span>
    </button>
  </div>
</div>

<div class="chatsec">
  <h2>Ask Orion</h2>
  <p class="sub">Our AI assistant is right here — no buttons, no popups. Just write your question.</p>
  <div id="evermod-chat"></div>
</div>

<p class="footer">EVERMOD · MODULAR HOMES · 23 YEARS · 2000+ PROJECTS</p>

<script>
window.EVERMOD_CHAT_CONFIG = {
  meetingLink: '',
  callbackPhone: '+371 27034348',
  callbackText: "Hi! I'd prefer a call back — when would be the best time to reach me?"
};
</script>
<script src="widget.js" defer></script>
<script>
document.getElementById('evm-card-video').addEventListener('click', function () {
  if (window.EVERMOD_CHAT_CONFIG.meetingLink) { window.open(window.EVERMOD_CHAT_CONFIG.meetingLink, '_blank'); }
  else { EvermodChat.scrollTo(); EvermodChat.ask('I would like to book a video call with a specialist'); }
});
</script>
</body></html>
